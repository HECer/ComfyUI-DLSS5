canonVersion: 1.14.0
agents:
- codex
loop:
  parallel: 1
  isolate: true
  enabled: true
  decisionPolicy: critical
  timeoutMinutes: 25
verify:
  requireCriteria: true
  command: rtk proxy python -B -m pytest -q -p no:cacheprovider tests
  retries: 0
codeGraph: graphify
codeIntelligence:
  mode: active
  policy:
    excludePatterns:
    - runtime/**
    - docs/images/**
    - .agents/**
    - .yoke/**
    - graphify-out/**
    maxFileBytes: 2000000
runner:
  agent: codex
routing:
  enabled: true
  strategy: capability
  maxCandidates: 3
  assessmentPolicy: prepared
  fallback: block
  workers:
  - id: codex-light
    agent: codex
    model: gpt-5.6-luna
    reasoningEffort: low
    tier: light
    costTier: low
    capabilities:
    - mechanical
    - tests
  - id: codex-standard
    agent: codex
    model: gpt-5.6-terra
    reasoningEffort: medium
    tier: standard
    costTier: low
    capabilities:
    - implementation
  - id: codex-strong
    agent: codex
    model: gpt-5.6-sol
    reasoningEffort: high
    tier: strong
    costTier: medium
    capabilities:
    - debugging
  - id: codex-frontier
    agent: codex
    model: gpt-6-astra
    reasoningEffort: high
    tier: frontier
    costTier: high
    capabilities:
    - architecture
  rules:
  - storyId: DLSS-1
    worker: codex-strong
    escalateTo: codex-frontier
  - storyId: DLSS-2
    worker: codex-strong
    escalateTo: codex-frontier
  - storyId: DLSS-3
    worker: codex-standard
    escalateTo: codex-frontier
  - storyId: DLSS-4
    worker: codex-strong
    escalateTo: codex-frontier
  - storyId: DLSS-5
    worker: codex-strong
    escalateTo: codex-frontier
  - storyId: DLSS-6
    worker: codex-strong
    escalateTo: codex-frontier
  - storyId: DLSS-7
    worker: codex-standard
    escalateTo: codex-frontier
completion:
  command: rtk proxy python -B -m pytest -q -p no:cacheprovider tests
  retries: 0
