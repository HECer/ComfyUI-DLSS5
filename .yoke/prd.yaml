- id: DLSS-1
  title: Repeatable setup and configuration preservation
  priority: 1
  needs: []
  area: dlss-usability
  acceptance:
    - id: config_roundtrip
      text: Read UTF-8 with or without BOM identically; report malformed/non-object
        configuration instead of silently returning empty; preserve custom
        temp_dir, timeout and unrelated valid settings when reinstalling.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          config_roundtrip
    - id: setup_repeatable
      text: Repeated manual setup accepts an existing junction to this repository,
        rejects a conflicting target before writes, writes BOM-safe JSON
        atomically, and preserves prior usable config on failure.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          setup_repeatable
  assessment:
    taskClass: debugging
    difficulty: medium
    uncertainty: medium
    risk: medium
    scope: medium
    testability: high
    reason: Existing Windows native bridge requires behavioral and workflow
      compatibility checks.
    approach: Inspect nodes._runtime_config, install_runtime.install and setup.ps1.
      Add failing regressions first, including execution of PowerShell fixture
      setup with harmless temporary files/interpreter when feasible. Keep
      optional absent config behavior. Validate configuration before modifying
      files. Shared small config helpers are fine; avoid wholesale
      restructuring.
  passes: false
  assessmentFor: b088fe97f928373b8de4a05ac29e10a6f363157ea3f96ae769d8a8f90aa6b63b
- id: DLSS-2
  title: Separate optional Frame Generation installation
  priority: 2
  needs:
    - DLSS-1
  area: dlss-usability
  acceptance:
    - id: base_install
      text: Base installer succeeds without FG runtime/worker and never downloads FG;
        missing required SR/NR assets fail before optional downloads; existing
        worker and config are preserved.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          base_install
    - id: fg_install
      text: Explicit FG installation validates its runtime and worker hashes, retains
        mismatch protection/backups, and is available through appended Setup
        action and headless CLI flags without changing existing action values.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          fg_install
  assessment:
    taskClass: implementation
    difficulty: medium
    uncertainty: medium
    risk: medium
    scope: medium
    testability: high
    reason: Existing Windows native bridge requires behavioral and workflow
      compatibility checks.
    approach: Change install_runtime.py, install_runtime.ps1 and setup node
      narrowly. Existing Install verified VapourKit means base install; append
      explicit FG action. Keep direct install_dlssg_worker behavior and tests.
      Simulate downloads/extraction, no network. Preserve previous optional FG
      configuration during base reinstall. Provide actionable retry for
      incomplete extraction without deleting unknown directories.
  passes: false
  assessmentFor: 467184d5b46346f953d7fda0045a586d1ee407df657ba03818b9cdba245c328d
