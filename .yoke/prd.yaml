- id: DLSS-2
  title: Separate optional Frame Generation installation
  priority: 2
  acceptance:
    - id: base_install
      text: Base installer succeeds without FG runtime/worker and never downloads FG;
        missing required SR/NR assets fail before optional downloads; existing
        worker and config are preserved.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          base_install
    - id: fg_install
      text: Explicit FG installation validates its runtime and worker hashes, retains
        mismatch protection/backups, and is available through appended Setup
        action and headless CLI flags without changing existing action values.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          fg_install
    - id: bridge_numpy
      text: The base installer probes NumPy in the selected isolated VapourSynth
        Python with a bounded timeout, installs missing NumPy only in that
        bridge environment, rechecks imports before writing config, and
        preserves existing working versions and ComfyUI Torch. Tests simulate
        success, failure and already-installed paths without network.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          bridge_numpy
  passes: true
  needs:
    - DLSS-1
  area: dlss-usability
  assessment:
    taskClass: implementation
    difficulty: medium
    uncertainty: medium
    risk: medium
    scope: medium
    testability: high
    reason: Existing Windows native bridge requires behavioral and workflow
      compatibility checks.
    approach: Change install_runtime.py, install_runtime.ps1 and setup node
      narrowly. Existing Install verified VapourKit means base install; append
      explicit FG action. Keep direct install_dlssg_worker behavior and tests.
      Simulate downloads/extraction, no network. Preserve previous optional FG
      configuration during base reinstall. Provide actionable retry for
      incomplete extraction without deleting unknown directories. Native
      baseline revealed the existing VapourKit Python imports VapourSynth but
      lacks NumPy. The bridge requires both. Ensure missing NumPy is installed
      only by explicit installer action into the isolated bridge interpreter,
      never upgrade an existing usable version or ComfyUI environment. Use
      bounded commands and actionable errors. Manual setup should at least
      detect and explain missing NumPy. Pin the new dependency to the locally
      verified NumPy 2.5.2 unless compatibility evidence requires another
      choice.
  assessmentFor: 74433207c0c3bc22c0eaeafd4e6d43d1eb8167143a620849d3f9c1b4105d32a5
