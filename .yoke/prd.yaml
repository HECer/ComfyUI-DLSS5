- id: DLSS-4
  title: Truthful runtime diagnostics and early preflight
  priority: 4
  needs:
    - DLSS-3
  area: dlss-usability
  acceptance:
    - id: runtime_diagnostics
      text: Status separates missing/LFS-pointer files, Python/VapourSynth import and
        plugin-load probes; reports actionable failures with bounded subprocess
        timeouts, never calls file existence runtime-ready; refreshes after
        external config change and can display results without third-party text
        nodes.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          runtime_diagnostics
    - id: early_preflight
      text: Easy operation checks ONLY required SR/NR runtime components before
        depth/motion model work; invalid configured Python path or unusable
        runtime fails before downloads; valid operation does not require unused
        stages.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          early_preflight
  assessment:
    taskClass: debugging
    difficulty: medium
    uncertainty: medium
    risk: medium
    scope: medium
    testability: high
    reason: Existing Windows native bridge requires behavioral and workflow
      compatibility checks.
    approach: Add bounded isolated import/LoadPlugin probes, no inference by
      default. Optional appended smoke action may run a tiny synthetic sample if
      safe; report runtime inference untested unless actually run. Preserve
      original no-argument status method, append optional fields if needed.
      Ensure OUTPUT_NODE and UI text return contract are handled correctly. Add
      IS_CHANGED/fingerprint for external state, avoid caching stale
      diagnostics. Setup should report directly via Comfy UI text. Redacted
      support report preferred, detailed paths local. Tests mock probes and
      model call order.
  passes: false
  assessmentFor: 1e23760fcbaccbaf5e23a0e7f13ffbb6d79a13b8d32d9eb0d445af42a0d93f44
- id: DLSS-5
  title: Honor bounded mode for all Easy operations
  priority: 5
  needs:
    - DLSS-4
  area: dlss-usability
  acceptance:
    - id: bounded_operations
      text: Long-video/Fast-preview Easy presets apply bounded windows to Upscale only
        and Neural rendering only as well as combined operation; merge outputs
        with exact chronological frame count, including short final windows and
        overlap larger than remaining frames.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          bounded_operations
    - id: truthful_presets
      text: Report resolved Auto scenario, actual execution mode, relevant active
        settings and frame dimensions/count; persistent single-stage paths
        retain a single unchanged native call and default presets/depth models
        remain unchanged.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          truthful_presets
  assessment:
    taskClass: debugging
    difficulty: medium
    uncertainty: medium
    risk: medium
    scope: medium
    testability: high
    reason: Existing Windows native bridge requires behavioral and workflow
      compatibility checks.
    approach: Reuse _pipeline_windows and _overlap_add carefully. Add deterministic
      frame-index fake SR/NR tests across 1,2,17,33,96,97,100 frames and scale
      cases; do not merely assert call count. Assert bounded versus persistent
      identity results align and no duplicate/drop/reorder. Maintain public
      signatures and style settings. Memory-efficient limits native windows, not
      the full Comfy IMAGE batch; describe honestly.
  passes: false
  assessmentFor: a06f3d08476ad3c0610def8a8ec0cd6c579f466b15e3bdcf9c70ce977e61a75e
- id: DLSS-6
  title: Progress, responsive cancellation and advisory memory estimates
  priority: 6
  needs:
    - DLSS-5
  area: dlss-usability
  acceptance:
    - id: progress_cancel
      text: Depth/flow/pipeline work publishes Comfy progress; long SR/NR subprocesses
        allow Comfy cancellation and cleanly terminate/reap children plus temp
        files; timeout disabled still permits cancellation; failures preserve
        useful bounded stderr.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          progress_cancel
    - id: memory_advice
      text: Before guide inference, Easy reports frame count, input/output resolution,
        estimated float32 array/temp storage and available disk warning where
        relevant; estimates scale with resolution and operation, explicitly
        exclude full VRAM prediction, and never change selected presets
        automatically.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          memory_advice
  assessment:
    taskClass: debugging
    difficulty: medium
    uncertainty: medium
    risk: medium
    scope: medium
    testability: high
    reason: Existing Windows native bridge requires behavioral and workflow
      compatibility checks.
    approach: Use optional Comfy imports with standalone-test fallback. Centralize
      only necessary subprocess lifecycle handling using Popen polling plus
      bounded/tail logs or temp log files to avoid pipe deadlock, preserve
      TimeoutExpired semantics. Test with short real Python child processes,
      injected cancellation, missing Comfy modules, timeouts, nonzero exits and
      cleanup. Emit progress in model loops and bridge per-frame protocol when
      practical. Support all operations; do not introduce arbitrary five-minute
      timeouts or automatically change quality. Keep output schema compatible.
  passes: false
  assessmentFor: b79a57b1405dbcdd61b6b583b880520d30daf57cf5d40495f223bb1e4f364d09
