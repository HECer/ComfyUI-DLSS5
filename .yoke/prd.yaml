- id: DLSS-4
  title: Truthful runtime diagnostics and early preflight
  priority: 4
  acceptance:
    - id: runtime_diagnostics
      text: Status separates missing/LFS-pointer files, Python/VapourSynth/NumPy
        import and plugin-load probes; reports actionable failures with bounded
        subprocess timeouts, never calls file existence runtime-ready; refreshes
        after external config change and can display results without third-party
        text nodes.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          runtime_diagnostics
    - id: early_preflight
      text: Easy operation checks ONLY required SR/NR runtime components before
        depth/motion model work; invalid configured Python path or unusable
        runtime fails before downloads; valid operation does not require unused
        stages.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          early_preflight
  passes: true
  needs:
    - DLSS-3
  area: dlss-usability
  assessment:
    taskClass: debugging
    difficulty: medium
    uncertainty: medium
    risk: medium
    scope: medium
    testability: high
    reason: Existing Windows native bridge requires behavioral and workflow
      compatibility checks.
    approach: "Add bounded isolated import/LoadPlugin probes, no inference by
      default. Optional appended smoke action may run a tiny synthetic sample if
      safe; report runtime inference untested unless actually run. Preserve
      original no-argument status method, append optional fields if needed.
      Ensure OUTPUT_NODE and UI text return contract are handled correctly. Add
      IS_CHANGED/fingerprint for external state, avoid caching stale
      diagnostics. Setup should report directly via Comfy UI text. Redacted
      support report preferred, detailed paths local. Tests mock probes and
      model call order. Include NumPy in bridge dependency diagnostics and Easy
      preflight: it is required by the runner and was absent in this actual
      configured VapourKit installation. Manual setup guidance must distinguish
      installing an automatically configured runtime from repairing the
      externally selected VapourKit Python: install_runtime.ps1 does not add
      NumPy to an arbitrary -VapourKitPath. Make the manual failure message
      direct users to the selected interpreter or to the automatic setup as an
      alternative, without promising that rerunning manual setup against an
      unchanged external environment will fix it."
  assessmentFor: faf18653bacbccc7b8666f5742bb7951b2f16b64b36ce7c8d028764336be9e0c
- id: DLSS-5
  title: Honor bounded mode for all Easy operations
  priority: 5
  acceptance:
    - id: bounded_operations
      text: Long-video/Fast-preview Easy presets apply bounded windows to Upscale only
        and Neural rendering only as well as combined operation; merge outputs
        with exact chronological frame count, including short final windows and
        overlap larger than remaining frames.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          bounded_operations
    - id: truthful_presets
      text: Report resolved Auto scenario, actual execution mode, relevant active
        settings and frame dimensions/count; persistent single-stage paths
        retain a single unchanged native call and default presets/depth models
        remain unchanged.
      verify:
        - python -m pytest -q -p no:cacheprovider tests/test_usability.py -k
          truthful_presets
  passes: true
